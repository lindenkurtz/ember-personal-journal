name = "ember-notifier"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Cron every 5 minutes. The Worker checks current local time inside the
# handler against `push_settings.{morning,evening}_time` and only sends if
# the relevant slot is due *and* the matching check-in fields for today are
# still empty.
[triggers]
crons = ["*/5 * * * *"]

# Secrets (set via `wrangler secret put`):
#   VAPID_PUBLIC_KEY    — base64url, also bundled into the SPA as VITE_VAPID_PUBLIC_KEY
#   VAPID_PRIVATE_KEY   — base64url
#   VAPID_SUBJECT       — e.g. mailto:you@example.com
#   SUPABASE_URL
#   SUPABASE_KEY        — the sb_secret_ key (bypasses RLS; needed for finance + push tables)
#   FORCE_KEY           — shared secret gating the manual /?force= trigger. This
#                         Worker is on *.workers.dev, which Cloudflare Access
#                         does not cover; without this secret the endpoint is
#                         disabled and every request 404s.
#   PLAID_CLIENT_ID     — optional; the daily finance sync is skipped without it
#   PLAID_SECRET        — optional
#   PLAID_ENV           — 'sandbox' | 'production' (defaults to sandbox)
